[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terrashift"
version = "3.0.0"
description = "TerraShift: NISAR surface-change processing, GNSS comparison and evidence export"
requires-python = ">=3.12"
dependencies = ["earthaccess>=0.16,<1", "h5py>=3.12,<4", "numpy>=2,<3", "python-dotenv>=1,<2", "tinynetrc>=1.3,<2", "filelock>=3,<4", "scipy>=1.14,<2", "pyproj>=3.7,<4", "rasterio>=1.4,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
api = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.scripts]
terrashift = "terrashift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
