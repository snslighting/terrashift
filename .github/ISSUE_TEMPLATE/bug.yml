name: Bug report
description: Something on the site or in the pipeline is wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or command
      description: A link to the exact view helps (use "Copy link" on the Analysis page)
  - type: input
    id: env
    attributes:
      label: Browser and device, or OS and Python version
