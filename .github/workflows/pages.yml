name: TerraShift CI and Pages
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: terrashift-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv
          uv sync --locked --extra api --extra dev
      - name: Scientific and API tests
        run: uv run --extra api --extra dev pytest -q
      - name: Lint
        run: |
          uv run --extra api --extra dev ruff check src scripts tests
          uv run --extra api --extra dev ruff format --check src scripts tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Browser smoke test of the built site
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node e2e/smoke.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-screenshots
          path: frontend/e2e/output
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website-v2
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
